[project]
name = "brew-backend"
version = "0.1.0"
description = "Brew room monitor API: sensor ingest, ambient conditions, yeast insights"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# Used by `fastapi dev`, `fastapi run` and `fastapi deploy` (FastAPI Cloud).
[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "DTZ",           # naive datetimes are bugs in a time-series app
    "SIM", "RET",    # simplify
    "ASYNC",         # blocking calls inside async def
    "FAST",          # FastAPI-specific
    "T20",           # no print()
]
ignore = ["B008"]   # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["I"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Warnings are errors, so a deprecation surfaces in the PR that triggers it.
# To ignore one on purpose, add "ignore::<Category>:<module>" below with a reason comment.
filterwarnings = [
    "error",
]
