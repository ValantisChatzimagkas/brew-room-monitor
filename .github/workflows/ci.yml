name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: brew, POSTGRES_PASSWORD: brew, POSTGRES_DB: brew }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U brew" --health-interval 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://brew:brew@localhost:5432/brew
      ADMIN_TOKEN: ci-token
    # CI runs the same make targets as `make check`, so local and CI can't drift.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: cd backend && uv sync --locked
      - run: make check-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: cd backend && uv sync --locked
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: make check-frontend

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v7
      - run: make setup
      - run: make smoke

