# Local full stack: `docker compose up --build` (add `--wait` to return once everything is healthy)
# Dev with hot reload: `docker compose up db` + run backend/frontend natively (see README).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brew
      POSTGRES_PASSWORD: brew
      POSTGRES_DB: brew
    ports: ["127.0.0.1:5432:5432"]  # dev creds: never reachable from the LAN
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U brew -d brew"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    # DATABASE_URL / API_URL are literals on purpose: the root .env holds native-dev (localhost)
    # values, so do not add `env_file:`. Only AUTH_* / AUTH0_* / APP_BASE_URL values are taken from it.
    environment:
      DATABASE_URL: postgresql+psycopg://brew:brew@db:5432/brew
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      ENVIRONMENT: local
    ports: ["8000:8000"]  # ESP32s on the LAN post here
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 30s  # migrations run before the server binds

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_SECRET: ${AUTH0_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Local sign-in provider for dev (`make dev` / `make up` start it through `make oidc`); unused with a
  # real tenant in .env. No healthcheck: the image is distroless (no shell, no HTTP client), so
  # `make oidc` polls discovery instead.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.3.0@sha256:dfcc1b60abe7414d2754767fceaec62a5dc79a10e543804069f69287b277e314
    environment:
      # The mock derives `iss` from the Host header, so the container port must equal the host port.
      SERVER_PORT: "9400"
      # This clone's signing key (and the login form, which any JSON_CONFIG turns off) from `make setup`:
      # the image's own key is public, so anyone could mint tokens with it. `{}`, not empty: empty
      # crashes the mock, and `{}` keeps a real-tenant .env booting.
      JSON_CONFIG: ${OIDC_JSON_CONFIG:-{}}
    # Loopback only: its form signs in any username for whoever reaches it.
    ports: ["127.0.0.1:9400:9400"]
    networks:
      default:
        # Containers and the browser use one issuer URL, http://oidc.localhost:9400/default.
        aliases: [oidc.localhost]

volumes:
  pgdata:
