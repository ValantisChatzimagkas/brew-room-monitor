# Local full stack: `docker compose up --build` (add `--wait` to return once everything is healthy)
# Dev with hot reload: `docker compose up db` + run backend/frontend natively (see README).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: brew
      POSTGRES_PASSWORD: brew
      POSTGRES_DB: brew
    ports: ["127.0.0.1:5432:5432"]  # dev creds: never reachable from the LAN
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U brew -d brew"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    # DATABASE_URL / API_URL are literals on purpose: the root .env holds native-dev (localhost)
    # values, so do not add `env_file:`. Only ADMIN_TOKEN is taken from it.
    environment:
      DATABASE_URL: postgresql+psycopg://brew:brew@db:5432/brew
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      ENVIRONMENT: local
    ports: ["8000:8000"]  # ESP32s on the LAN post here
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 30s  # migrations run before the server binds

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
